<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreamApp TMA</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }
    .header p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .balance-box {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
    }
    .balance-label {
      font-size: 12px;
      color: #9ca3af;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .balance-amount {
      font-size: 32px;
      font-weight: 800;
      color: #10b981;
      margin-top: 6px;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.8;
    }
    .btn-task {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-withdraw {
      background: #059669;
      color: #ffffff;
    }
    .status-msg {
      text-align: center;
      font-size: 13px;
      min-height: 20px;
      margin-top: 10px;
      color: #38bdf8;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>StreamApp TMA</h1>
      <p>Mini App Ufficiale Telegram & Web</p>
    </div>

    <div class="balance-box">
      <div class="balance-label">Saldo Reale Certificato</div>
      <div class="balance-amount" id="balanceDisplay">$0.00 USD</div>
      <div class="stats-row">
        <span>Task completati: <strong id="viewsDisplay">0</strong></span>
        <span>Stato: <strong style="color: #10b981;">Online</strong></span>
      </div>
    </div>

    <button class="btn btn-task" id="taskBtn">⚡ Completa Task (+0.50$)</button>
    <button class="btn btn-withdraw" id="withdrawBtn">💸 Richiedi Prelievo Sicuro</button>

    <div class="status-msg" id="statusMsg"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const initData = tg?.initData || "query_id=TEST&user=%7B%22id%22%3A123456%7D&auth_date=" + Math.floor(Date.now()/1000) + "&hash=test";

    function showStatus(msg, isError = false) {
      const el = document.getElementById('statusMsg');
      el.style.color = isError ? '#ef4444' : '#38bdf8';
      el.innerText = msg;
      setTimeout(() => { el.innerText = ''; }, 4000);
    }

    async function apiCall(endpoint, payload = {}) {
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-telegram-init-data': initData,
            'x-request-timestamp': String(Date.now())
          },
          body: JSON.stringify(payload)
        });
        return await res.json();
      } catch (e) {
        showStatus('Errore di connessione', true);
        return null;
      }
    }

    // Inizializza utente
    window.addEventListener('DOMContentLoaded', async () => {
      const res = await apiCall('/api/v1/user/init', { selected_token: 'DOGS', vertical: 'WEB3' });
      if (res?.success && res.user) {
        document.getElementById('balanceDisplay').innerText = `$${(res.user.balance_usd || 0).toFixed(2)} USD`;
        document.getElementById('viewsDisplay').innerText = res.user.completed_views || 0;
      }
    });

    // Task
    document.getElementById('taskBtn').addEventListener('click', async () => {
      showStatus('Elaborazione task in corso...');
      const res = await apiCall('/api/v1/track-completion');
      if (res?.success) {
        document.getElementById('balanceDisplay').innerText = `$${res.new_balance_usd.toFixed(2)} USD`;
        document.getElementById('viewsDisplay').innerText = res.views;
        showStatus('Task completato! +$0.50 USD');
      } else {
        showStatus(res?.message || 'Attendi 2 secondi prima del prossimo task', true);
      }
    });

    // Prelievo
    document.getElementById('withdrawBtn').addEventListener('click', async () => {
      showStatus('Verifica saldo per prelievo...');
      const res = await apiCall('/api/v1/user/withdraw', { amount_usd: 1.00, token: 'DOGS' });
      if (res?.success) {
        document.getElementById('balanceDisplay').innerText = `$${res.new_balance_usd.toFixed(2)} USD`;
        showStatus('Prelievo processato con successo!');
      } else {
        showStatus(res?.error === 'INSUFFICIENT_REAL_BALANCE' ? 'Saldo insufficiente (minimo $1.00)' : (res?.message || 'Errore prelievo'), true);
      }
    });
  </script>
</body>
  </html>
